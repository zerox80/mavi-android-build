name: Publish Android build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test source staging and APK verification
        run: python3 -m unittest discover -s tests -v

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Android toolchain
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/zerox80/mavi-android-build:latest
            ghcr.io/zerox80/mavi-android-build:sha-${{ github.sha }}
          cache-from: type=gha,scope=android-toolchain
          cache-to: type=gha,scope=android-toolchain,mode=max
          labels: |
            org.opencontainers.image.title=Mavi Android build toolchain
            org.opencontainers.image.source=https://github.com/zerox80/mavi-android-build
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
